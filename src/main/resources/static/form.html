
<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thêm sinh viên | Student Management</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/adminlte/css/adminlte.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", sans-serif;
            color: #343a40;
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd, #3d8bfd);
            color: white;
            padding: 28px 32px;
            border-radius: 16px;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.15);
        }

        .page-header h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-header p {
            margin: 0;
            opacity: 0.9;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-card-header {
            padding: 24px 30px;
            border-bottom: 1px solid #edf0f4;
        }

        .form-card-header h5 {
            font-weight: 700;
            margin: 0 0 6px;
        }

        .form-card-header p {
            color: #7b8491;
            margin: 0;
            font-size: 14px;
        }

        .form-card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 9px;
            color: #495057;
        }

        .form-label .required {
            color: #dc3545;
        }

        .input-group-text {
            background: #f8f9fc;
            color: #6c757d;
            border-color: #dee2e6;
        }

        .form-control {
            min-height: 46px;
            border-color: #dee2e6;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 22px 30px;
            background: #fafbfc;
            border-top: 1px solid #edf0f4;
        }

        .btn {
            padding: 11px 22px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-success {
            background: #198754;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 22px;
        }

        @media (max-width: 576px) {
            .page-header {
                padding: 22px;
            }

            .form-card-body {
                padding: 22px;
            }

            .form-actions {
                padding: 18px 22px;
                flex-direction: column-reverse;
            }

            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div class="container-fluid py-4 px-3 px-md-4">

    <!-- Tiêu đề trang -->
    <div class="page-header">
        <div class="d-flex align-items-center mb-3">
            <a href="/student.html"
               class="text-white me-3"
               style="font-size: 22px;"
               title="Quay lại danh sách">
                <i class="bi bi-arrow-left-circle"></i>
            </a>

            <div>
                <h2>Thêm sinh viên</h2>
                <p>Nhập thông tin để tạo hồ sơ sinh viên mới.</p>
            </div>
        </div>
    </div>

    <!-- Form -->
    <div class="form-card">

        <div class="form-card-header">
            <h5>
                <i class="bi bi-person-vcard text-primary me-2"></i>
                Thông tin sinh viên
            </h5>
            <p>Các trường có dấu <span class="text-danger">*</span> là bắt buộc.</p>
        </div>

        <form id="studentForm">

            <div class="form-card-body">

                <div class="section-title">
                    <i class="bi bi-person-lines-fill me-2"></i>
                    THÔNG TIN CÁ NHÂN
                </div>

                <div class="row g-4">

                    <!-- Mã sinh viên -->
                    <div class="col-md-6">
                        <label for="studentCode" class="form-label">
                            Mã sinh viên <span class="required">*</span>
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-upc-scan"></i>
                            </span>
                            <input type="text"
                                   id="studentCode"
                                   class="form-control"
                                   placeholder="Ví dụ: SV001"
                                   required>
                        </div>
                    </div>

                    <!-- Họ tên -->
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">
                            Họ và tên <span class="required">*</span>
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text"
                                   id="fullName"
                                   class="form-control"
                                   placeholder="Nhập họ và tên"
                                   required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            Email <span class="required">*</span>
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email"
                                   id="email"
                                   class="form-control"
                                   placeholder="example@email.com"
                                   required>
                        </div>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="col-md-6">
                        <label for="phone" class="form-label">
                            Số điện thoại <span class="required">*</span>
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-telephone"></i>
                            </span>
                            <input type="tel"
                                   id="phone"
                                   class="form-control"
                                   placeholder="Nhập số điện thoại"
                                   required>
                        </div>
                    </div>

                    <!-- Lớp -->
                    <div class="col-md-6">
                        <label for="className" class="form-label">
                            Lớp <span class="required">*</span>
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-mortarboard"></i>
                            </span>
                            <input type="text"
                                   id="className"
                                   class="form-control"
                                   placeholder="Ví dụ: FE1003-K24"
                                   required>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Nút hành động -->
            <div class="form-actions">
                <a href="/student.html"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle me-1"></i>
                    Hủy
                </a>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle me-1"></i>
                    Lưu sinh viên
                </button>
            </div>

        </form>
    </div>

</div>

<script src="/assets/js/form.js"></script>
</body>
</html>
