
<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/adminlte/css/adminlte.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f4f6f9;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #343a40;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar bên trái */
        .sidebar {
            width: 275px;
            flex-shrink: 0;
            background: #20232c;
            color: #c2c7d0;
        }

        .brand {
            height: 61px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid #454952;
            color: #e5e7eb;
            font-size: 20px;
        }

        .brand i {
            color: #28a745;
            font-size: 25px;
        }

        .sidebar-menu {
            padding: 18px 9px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 18px;
            margin-bottom: 5px;
            border-radius: 5px;
            color: #c2c7d0;
            text-decoration: none;
            font-size: 16px;
        }

        .sidebar-menu a i {
            font-size: 18px;
        }

        .sidebar-menu a:hover {
            background: #343a40;
            color: white;
        }

        .sidebar-menu a.active {
            background: #343a40;
            color: white;
        }

        /* Nội dung chính */
        .main {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            height: 34px;
            background: white;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 25px;
            color: #6c757d;
            font-size: 14px;
        }

        .content {
            padding: 18px 22px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 400;
            color: #212529;
        }

        .breadcrumb {
            margin: 0;
            padding: 0;
            background: transparent;
            font-size: 16px;
        }

        .breadcrumb a {
            color: #343a40;
            text-decoration: none;
        }

        /* Khung danh sách */
        .student-card {
            background: white;
            border: 1px solid #d6d9dc;
            border-radius: 6px;
            overflow: hidden;
        }

        .card-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 20px;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
        }

        .card-heading h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 400;
        }

        .btn {
            border-radius: 4px;
            font-size: 14px;
            padding: 8px 13px;
            white-space: nowrap;
        }

        .btn-add {
            color: white;
            background: #0d6efd;
            border: 1px solid #0d6efd;
            text-decoration: none;
        }

        .btn-add:hover {
            background: #0b5ed7;
            color: white;
        }

        /* Thanh tìm kiếm */
        .card-body {
            padding: 17px 18px 0;
        }

        .search-area {
            display: flex;
            width: min(100%, 645px);
            margin-bottom: 17px;
        }

        .search-area input {
            flex: 1;
            min-width: 0;
            height: 42px;
            padding: 8px 13px;
            border: 1px solid #ced4da;
            border-radius: 5px 0 0 5px;
            font-size: 15px;
            outline: none;
        }

        .search-area input:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 2px #bfdeff;
        }

        .search-area button {
            border-radius: 0 5px 5px 0;
        }

        /* Bảng */
        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .student-table {
            width: 100%;
            min-width: 950px;
            border-collapse: collapse;
            margin: 0;
        }

        .student-table th {
            padding: 13px 12px;
            text-align: left;
            white-space: nowrap;
            border-top: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
            font-size: 16px;
            font-weight: 700;
            color: #343a40;
        }

        .student-table td {
            padding: 12px;
            border-top: 1px solid #dee2e6;
            font-size: 16px;
            vertical-align: middle;
        }

        .student-table tbody tr:nth-child(even) {
            background: #e9ecef;
        }

        .student-table tbody tr:hover {
            background: #dfe6ed;
        }

        .student-table .center {
            text-align: center;
        }

        .student-code {
            color: #343a40;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px 10px;
            border: 0;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-edit {
            background: #ffc107;
            color: #212529;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-edit:hover,
        .btn-delete:hover {
            filter: brightness(0.92);
        }

        .empty-message {
            text-align: center;
            color: #6c757d;
            padding: 25px !important;
        }

        @media (max-width: 900px) {
            .sidebar { width: 210px; }
            .content { padding: 16px; }
        }

        @media (max-width: 650px) {
            .sidebar { width: 60px; }
            .brand span,
            .sidebar-menu a span { display: none; }

            .brand { font-size: 22px; }
            .sidebar-menu { padding: 15px 6px; }

            .sidebar-menu a {
                justify-content: center;
                padding: 12px 5px;
            }

            .page-heading h1 { font-size: 24px; }
            .card-heading { align-items: flex-start; }
            .search-area { width: 100%; }
        }
    </style>
</head>

<body>
<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <i class="bi bi-mortarboard-fill"></i>
            <span>University Training</span>
        </div>

        <nav class="sidebar-menu">
            <a href="/student.html" class="active">
                <i class="bi bi-people"></i>
                <span>Sinh viên</span>
            </a>

            <a href="#">
                <i class="bi bi-book"></i>
                <span>Học phần</span>
            </a>

            <a href="#">
                <i class="bi bi-building"></i>
                <span>Phòng học</span>
            </a>
        </nav>
    </aside>

    <!-- Nội dung -->
    <main class="main">
        <div class="topbar">
            <i class="bi bi-person-circle me-2"></i>
            Quản lý đào tạo
        </div>

        <div class="content">

            <div class="page-heading">
                <h1>Quản lý sinh viên</h1>

                <div class="breadcrumb">
                    <a href="/student.html">Home</a>
                    <span class="mx-2">/</span>
                    <span>Sinh viên</span>
                </div>
            </div>

            <section class="student-card">

                <!-- Tiêu đề khung + nút thêm -->
                <div class="card-heading">
                    <h2>
                        <i class="bi bi-people me-2"></i>
                        Danh sách sinh viên
                    </h2>

                    <a href="/form.html?mode=create"
                       class="btn btn-add">
                        <i class="bi bi-plus-circle me-1"></i>
                        Thêm sinh viên
                    </a>
                </div>

                <div class="card-body">

                    <!-- Tìm kiếm -->
                    <div class="search-area">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Tìm mã SV, họ tên, email..."
                        >

                        <button
                            type="button"
                            id="searchButton"
                            class="btn btn-primary">
                            <i class="bi bi-search"></i>
                            Tìm kiếm
                        </button>
                    </div>

                    <!-- Bảng -->
                    <div class="table-wrap">
                        <table class="student-table">
                            <thead>
                                <tr>
                                    <th style="width: 5%;" class="center">STT</th>
                                    <th style="width: 14%;">Mã sinh viên</th>
                                    <th style="width: 17%;">Họ và tên</th>
                                    <th style="width: 20%;">Email</th>
                                    <th style="width: 16%;">Số điện thoại</th>
                                    <th style="width: 10%;">Lớp</th>
                                    <th style="width: 18%;" class="center">Thao tác</th>
                                </tr>
                            </thead>

                            <tbody id="studentTableBody">
                                <tr>
                                    <td colspan="7" class="empty-message">
                                        Đang tải dữ liệu...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="/assets/js/student.js"></script>
</body>
</html>
